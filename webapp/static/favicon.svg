<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#13315f"/>
      <stop offset="100%" stop-color="#060f22"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Radar screen -->
  <circle cx="50" cy="50" r="47" fill="url(#bg)"/>

  <!-- Range rings + crosshair -->
  <g fill="none" stroke="#5ab4f0" stroke-opacity="0.5" stroke-width="2">
    <circle cx="50" cy="50" r="34"/>
    <circle cx="50" cy="50" r="20"/>
    <line x1="50" y1="6" x2="50" y2="94"/>
    <line x1="6"  y1="50" x2="94" y2="50"/>
  </g>

  <!-- Sweep + detected lead -->
  <path d="M50 50 L50 6 A44 44 0 0 1 88.1 28 Z" fill="url(#sweep)"/>
  <circle cx="66" cy="34" r="5" fill="#34d399"/>
  <circle cx="50" cy="50" r="3.5" fill="#e2f3ff"/>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="rgba(90,180,240,0.35)" stroke-width="1.5"/>
</svg>
